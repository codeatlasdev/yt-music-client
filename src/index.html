<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YT Music Native PoC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #030303;
      color: #fff;
      padding: 48px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
    }
    h1 { font-size: 18px; font-weight: 500; opacity: 0.7; }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #e53935; }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #e53935;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #c62828; }
    #status {
      font-size: 12px;
      opacity: 0.5;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <h1>🎵 YT Music — Native Player PoC</h1>
  <input id="videoId" placeholder="Video ID (e.g. dQw4w9WgXcQ)" />
  <button onclick="play()">▶ Play</button>
  <div id="status">Enter a YouTube video ID and press Play</div>

  <script>
    async function play() {
      const id = document.getElementById('videoId').value.trim();
      if (!id) return;
      document.getElementById('status').textContent = 'Fetching stream...';
      try {
        const result = await window.__TAURI__.core.invoke('play_track', { videoId: id });
        document.getElementById('status').textContent = '▶ ' + result;
      } catch(e) {
        document.getElementById('status').textContent = '❌ ' + e;
      }
    }
    document.getElementById('videoId').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') play();
    });
  </script>
</body>
</html>
